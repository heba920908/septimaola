name: Daily Social Media Post

on:
  schedule:
    # Run daily at 9 AM UTC (3 AM Mexico City time)
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual posting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      provider:
        description: 'AI provider to use'
        required: false
        default: 'deepseek'
        type: choice
        options:
          - 'deepseek'
          - 'codemie'

permissions:
  contents: read

jobs:
  daily-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: ./automation
        run: uv sync

      - name: Run daily post
        working-directory: ./automation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CODEMIE_BASE_URL: ${{ secrets.CODEMIE_BASE_URL }}
          CODEMIE_KEYCLOAK_URL: ${{ secrets.CODEMIE_KEYCLOAK_URL }}
          CODEMIE_REALM: ${{ secrets.CODEMIE_REALM }}
          CODEMIE_CLIENT_ID: ${{ secrets.CODEMIE_CLIENT_ID }}
          CODEMIE_CLIENT_SECRET: ${{ secrets.CODEMIE_CLIENT_SECRET }}
          CODEMIE_ASSISTANT_ID: ${{ secrets.CODEMIE_ASSISTANT_ID }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          PROVIDER="${{ github.event.inputs.provider || 'deepseek' }}"
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            uv run daily-post --provider "$PROVIDER" --dry-run --verbose
          else
            uv run daily-post --provider "$PROVIDER" --verbose
          fi
