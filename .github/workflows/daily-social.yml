name: Daily Social Media Post

on:
  schedule:
    # Run Tuesdays and Thursdays at 12 UTC (6 AM Mexico City time)
    - cron: '0 12 * * 2,4'
  # Dry run to test the workflow without posting to social media
  # push:
  #   branches:
  #     - ah/availability
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (no actual posting)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  daily-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.x"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: ./automation
        run: uv sync

      - name: Restore posted-video history cache
        id: posted-cache
        uses: actions/cache/restore@v4
        with:
          path: automation/.state/posted.json
          key: posted-videos
          restore-keys: |
            posted-videos-

      - name: Run daily post
        working-directory: ./automation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
            uv run daily-post --dry-run
          else
            uv run daily-post
          fi

      - name: Save posted-video history cache
        if: always() && hashFiles('automation/.state/posted.json') != ''
        uses: actions/cache/save@v4
        with:
          path: automation/.state/posted.json
          key: posted-videos-${{ github.run_id }}
