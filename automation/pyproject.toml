[project]
name = "septima-automation"
version = "0.1.0"
description = "Daily social media automation for Séptima Ola band"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "ffmpeg-python>=0.2.0",
]

[project.scripts]
daily-post = "septima_automation.daily_post:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/septima_automation"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]
